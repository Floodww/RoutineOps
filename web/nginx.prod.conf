# X-Real-IP ставится на уровне server, а НЕ в отдельных location: сервер верит этому
# заголовку от доверенного прокси (internal/server/api/realip.go), а nginx незнакомые
# заголовки пропускает наверх как есть. Пока заголовок выставлялся только в location
# /api/, через любую другую локацию клиент мог прислать свой собственный X-Real-IP, и
# он доезжал до сервера подписанным авторитетом nginx. Здесь директива ПЕРЕЗАПИСЫВАЕТ
# присланное клиентом — в этом и смысл.
#
# ⚠️ proxy_set_header не наследуется, если location объявляет СВОЙ proxy_set_header:
# тогда наследуются НУЛЬ директив с верхнего уровня. Поэтому ни в одной локации ниже
# своих proxy_set_header быть не должно — иначе она молча останется без X-Real-IP.
server {
    listen 80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Бинари агента раздаём и по HTTP: они публичны, а инсталлятор сверяет sha256-пин
    # (getInstaller). Это позволяет скачать агент на дефолтном IP/self-signed деплое,
    # где Invoke-WebRequest/curl отвергают непроверяемый серверный сертификат. Канал
    # enroll (ca.crt по -ca-sha256 + gRPC/mTLS) остаётся защищённым.
    location /downloads/ {
        proxy_pass https://server:8081;
        proxy_ssl_verify off;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';" always;

    location /api/ {
        proxy_pass https://server:8081;
        proxy_ssl_verify off;
    }

    location /ca.crt {
        proxy_pass https://server:8081;
        proxy_ssl_verify off;
    }

    location /api/v1/installer {
        proxy_pass https://server:8081;
        proxy_ssl_verify off;
    }

    location /downloads/ {
        proxy_pass https://server:8081;
        proxy_ssl_verify off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}