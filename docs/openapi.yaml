  /api/v1/admin-access-requests/{id}/respond:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Локальные админ-права]
      summary: Решение по запросу
      description: |
        Роль: `it_admin`. Одобрение выдаёт сотруднику права локального администратора
        на его машине на ограниченный срок. Решение записывается в аудит вместе с тем,
        кто его принял.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, deny]
                duration_seconds:
                  type: integer
                  description: Срок действия прав при одобрении
      responses:
        '200': { description: Решение записано }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin-access-requests/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Локальные админ-права]
      summary: Отзыв выданных прав
      description: |
        Роль: `it_admin`. Защитное действие, поэтому сервисному токену разрешено.
      responses:
        '200': { description: Отозвано }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Пользователи ───────────────────────────
  /api/v1/admin-access-requests/{id}/changes:
    get:
      tags: [Админ-доступ]
      summary: Улики сессии по заявке
      description: |
        Сводка полноты улик и строки дельты ПО/служб за время выданных прав.
        Формулировки в UI без обвинений. Фильтр human_likely+unknown — на клиенте.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Сводка и изменения
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence: { $ref: '#/components/schemas/AdminAccessEvidence' }
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSessionChange' }
        '404': { description: Заявка не найдена }


  /api/v1/auth/tenants:
    get:
      tags: [Аутентификация]
      summary: Тенанты текущей личности
      description: |
        ADR-7: отдаёт членства ЭТОГО человека, а не реестр инсталляции (для реестра
        есть `/api/v1/tenants` под надзором). Сервисный токен получает 403: личности
        у него нет, он выпущен на одно членство и переключаться ему некуда.

        Признак `active` указывает членство, в котором выпущен текущий токен.
      x-requires-human: true
      responses:
        '200':
          description: Список членств
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tenant_id, tenant_name, role, active]
                  properties:
                    tenant_id: { type: string, format: uuid }
                    tenant_name: { type: string }
                    role: { type: string, enum: [it_admin, viewer] }
                    active: { type: boolean }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/auth/tenant:
    post:
      tags: [Аутентификация]
      summary: Переключение активного тенанта
      description: |
        ADR-7 §11.4. Выпускает токен на ДРУГОЕ членство той же личности; claim `act`
        не появляется — `UserID` в токене это строка `users`, а она уже принадлежит
        ровно одному тенанту.

        Прежний `jti` уходит в блок-лист ДО выдачи нового: иначе оба токена жили бы
        одновременно, и отозванная сессия продолжала бы работать в старом тенанте.
        Членство, которого у личности нет, даёт 403 — по этому же признаку событие
        попадает в журнал как `switch_tenant_denied`.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: Токен перевыпущен на указанный тенант
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Членства в указанном тенанте нет }

  /api/v1/auth/oidc/{id}/begin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Идентификатор OIDC-провайдера.
    get:
      tags: [Аутентификация]
      summary: Начало SSO-входа (Authorization Code + PKCE)
      description: |
        Enterprise. Без аутентификации: это вход. Редиректит на authorization endpoint
        провайдера, сохраняя `state` и PKCE-verifier.

        Провайдер резолвится по id SECURITY DEFINER-функцией: тенант на этом шаге ещё
        неизвестен, а строка `oidc_providers` тенантская. Выключенный провайдер флоу
        не начинает. Ограничение частоты — 20 запросов в минуту с адреса.

        В open-core ручки нет: ответ `501`.
      security: []
      responses:
        '302': { description: Редирект на IdP }
        '404': { description: Провайдера нет либо он выключен }
        '429': { description: Превышена частота запросов }
        '501': { description: Сборка без поддержки SSO (open-core) }

  /api/v1/auth/oidc/{id}/callback:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Идентификатор OIDC-провайдера.
    get:
      tags: [Аутентификация]
      summary: Возврат от IdP после SSO-входа
      description: |
        Enterprise. Без аутентификации. Обменивает код на `id_token`, проверяет подпись
        по JWKS, `iss` и `aud`.

        🔴 Пользователь ищется ТОЛЬКО в тенанте провайдера: e-mail уникален в пределах
        тенанта, поэтому глобальный поиск пускал бы чужой IdP в одноимённую учётку
        соседнего тенанта. Учётные записи не создаются — человек должен уже быть
        заведён; иначе редирект с `sso_error=not_registered`.

        `email_verified=false` отвергается: вход мапится по адресу, и непроверенный
        адрес означал бы захват учётной записи.
      security: []
      parameters:
        - { name: code,  in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '302':
          description: |
            Редирект на веб-интерфейс. При успехе выставляется сессионная кука,
            при отказе добавляется `?sso_error=…` (`not_registered`, `auth_failed`).
        '429': { description: Превышена частота запросов }
        '501': { description: Сборка без поддержки SSO (open-core) }

  /api/v1/devices/{id}/filevault-provision:
    x-enterprise: true
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Устройства]
      summary: Дозавершить provisioning FileVault на устройстве
      description: |
        Enterprise, macOS. Гейт лицензии живой: при истечении ручка перестаёт принимать
        запросы без рестарта, иначе оплаченная кастодия продолжала бы наполняться.

        Роль: `it_admin` + `requireHuman` (сервисный токен получает 403). До 04.08 ручка
        висела в authed-группе и её брал любой аутентифицированный субъект, включая
        `viewer`. Именно human-admin: provisioning заводит на машине сотрудника
        локального админа с Secure Token, то есть повышает права на эндпоинте.

        Оператор-путь взамен визита к машине: на парке «зайти в терминал каждого мака
        и ввести пароль» раскаткой не является, а без пароля держателя Secure Token
        ключ восстановления не добыть. Задача доезжает обычным каналом доставки, а
        пароль агент запрашивает у сотрудника через трей — служба сама его взять не
        может и не должна.

        Задача одна на устройство: повторный вызов отдаёт уже стоящую в очереди,
        иначе сотруднику вылезла бы очередь диалогов подряд.
      responses:
        '202':
          description: Задача поставлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string, format: uuid }
                  status: { type: string, example: pending }
        '402': { description: Нет действующей лицензии на FileVault }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/agent/escrow-recipient:
    get:
      tags: [Служебное]
      summary: Опубликованный получатель эскроу
      description: |
        Без аутентификации, как и манифест самообновления: артефакт подписан релизным
        ключом деплойера, а сам получатель — публичный ключ. Доверие держит подпись, а
        не то, кто спросил.

        Агент проверяет подпись релизным ключом (он приходит ему при энроллменте) и
        принимает запись, только если `epoch` не меньше уже виденного — это
        anti-rollback: иначе откат на прежнего, возможно скомпрометированного,
        получателя выглядел бы штатной публикацией. Канон подписи —
        `epoch\nrecipient\nfpr`.

        Схема позволяет менять кастодию публикацией, а не пересборкой агента: пиннинг
        получателя в бинарь для этого больше не нужен.

        `404`, пока ничего не публиковали — тогда агент работает по вшитому пину, и
        включение схемы не ломает уже раскатанный парк.
      security: []
      responses:
        '200':
          description: Текущий получатель
          content:
            application/json:
              schema:
                type: object
                required: [epoch, recipient, fpr, signature]
                properties:
                  epoch: { type: integer, format: int64 }
                  recipient: { type: string, example: age1... }
                  fpr: { type: string }
                  signature: { type: string, description: base64 ed25519 по канону }
        '404': { description: Получатель ещё не публиковался }

  /api/v1/tenants:
    get:
      tags: [Тенанты]
      summary: Реестр тенантов инсталляции
      description: |
        Доступно любой аутентифицированной роли. Поле `show_tenant` в ответе — `false`,
        если в инсталляции один тенант (UI прячет сущность «тенант», §10.2).
      responses:
        '200':
          description: Тенанты
          content:
            application/json:
              schema:
                type: object
                required: [show_tenant, tenants]
                properties:
                  show_tenant: { type: boolean }
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Тенанты]
      summary: Создание тенанта
      description: |
        Роль: `provider_admin`. Только учётная запись человека (`x-requires-human`).
        Аудит пишется в журнал нового тенанта.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Тенант создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
  /api/v1/tenants/{id}:
    patch:
      tags: [Тенанты]
      summary: Переименование тенанта
      description: |
        Роль: `provider_admin`. Только учётная запись человека (`x-requires-human`).
      x-requires-human: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Тенант переименован
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Тенанты]
      summary: Удаление тенанта
      description: |
        Роль: `provider_admin`. Только учётная запись человека (`x-requires-human`).

        Устройства, люди, группы, скрипты и политики удаляемого тенанта переходят
        в тенант по умолчанию — ничего не пропадает и переносить заранее не нужно.
        Тенант по умолчанию удалить нельзя: в нём бутстрап-личность, без которой
        в систему некому войти; переименовать его при этом можно.

        Строка тенанта сохраняется тумбстоуном и исчезает из всех выборок. Это не
        оптимизация: журнал аудита тенантский, у каждого тенанта собственная
        хеш-цепочка, и перенос записей склеил бы две независимые цепочки, а
        удаление стёрло бы доказательную часть за прошедший период.
      x-requires-human: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Тенант удалён, содержимое перенесено в тенант по умолчанию }
        '400': { description: Попытка удалить тенант по умолчанию }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tenants/{id}/invites:
    post:
      tags: [Тенанты]
      summary: Приглашение в конкретный тенант
      description: |
        Роль: `provider_admin`. Только учётная запись человека (`x-requires-human`).

        Обычное приглашение заводит человека в тенант приглашающего, поэтому в
        свежесозданный тенант им было некого позвать — он оставался недостижим.
        Эта ручка приглашает в указанный тенант.

        Если почта выключена или письмо не ушло, ответ содержит `invite_url` —
        ссылку передают вручную, иначе пригласить было бы нечем.
      x-requires-human: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [it_admin, viewer]
                  default: viewer
                  description: Не указана — наименьшие права.
      responses:
        '200':
          description: Приглашение создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: invited }
                  email_sent: { type: string, enum: ['true', 'false'] }
                  invite_url:
                    type: string
                    description: Присутствует, когда письмо не отправлено.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/devices/{id}/tenant:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Тенанты]
      summary: Перенос устройства в другой тенант
      description: |
        Роль: `provider_admin`. Только учётная запись человека (`x-requires-human`).

        Членство в группах при переносе снимается: группы принадлежат покинутому
        тенанту, и устройство, оставшееся в них, оказалось бы под чужими политиками.
        Владелец отвязывается по той же причине — карточка человека тенантская.
        Сертификат НЕ перевыпускается: он удостоверяет машину, а не подразделение,
        и перевыпуск потребовал бы переэнроллмента.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '204': { description: Устройство перенесено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { description: Устройство или тенант не найдены }

  /api/v1/users:
    get:
      tags: [Пользователи]
      summary: Пользователи
      responses:
        '200':
          description: Пользователи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

  /api/v1/users/invite:
    post:
      tags: [Пользователи]
      summary: Приглашение пользователя
      description: |
        Роль: `it_admin`. Выпускает учётные данные человека с любой ролью, включая
        `it_admin`, а принятие приглашения авторизации не требует.

        Если почта на сервере не настроена, ссылка приглашения возвращается прямо в
        теле ответа — обращайтесь с ней как с паролем.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Приглашение выпущено
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_sent: { type: boolean }
                  invite_url:
                    type: string
                    description: Только если письмо отправить не удалось
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/users/{id}:
    delete:
      tags: [Пользователи]
      summary: Удаление учётной записи
      description: |
        Роль: `it_admin`. Отбирает доступ насовсем: активные сессии удалённого
        отвергаются немедленно, выпущенные им сервисные токены удаляются вместе с ним.

        Что переживает удаление: записи журнала аудита (ссылки на `users` у него нет
        намеренно), выпущенные им приглашения, раскрытия эскроу и заявки на локальные
        права — у них ссылка обнуляется, но строки остаются.

        Два отказа со статусом `409`: удалить самого себя и удалить последнего
        `it_admin`. Второй возможен только в гонке — двое удаляют друг друга
        одновременно; проверка сериализована на стороне БД.
      x-requires-human: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Удалён }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Себя удалить нельзя либо это последний `it_admin`

  # ─────────────────────────── API-токены ───────────────────────────
  /api/v1/api-tokens:
    get:
      tags: [API-токены]
      summary: Список сервисных токенов
      description: 'Роль: `it_admin`. Сам секрет не хранится и не возвращается.'
      x-requires-human: true
      responses:
        '200':
          description: Токены
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIToken' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
    post:
      tags: [API-токены]
      summary: Выпуск сервисного токена
      description: |
        Роль: `it_admin`. Секрет возвращается ОДИН раз и больше не восстанавливается.

        Токен — это учётные данные с ролью, поэтому его выпуск приравнен к заведению
        пользователя и запрещён другим токенам: иначе утёкший токен выписал бы себе
        новый, который пережил бы удаление исходного.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { $ref: '#/components/schemas/Role' }
                expires_in_days:
                  type: integer
                  description: 0 — без срока
      responses:
        '201':
          description: Токен выпущен
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Секрет. Показывается ОДИН раз.
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/api-tokens/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [API-токены]
      summary: Отзыв сервисного токена
      description: 'Роль: `it_admin`. Отзыв мгновенный.'
      x-requires-human: true
      responses:
        '204': { description: Отозван }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  # ─────────────────── FileVault-эскроу: выгрузка (Enterprise) ───────────────────
  # Возможность редакции Enterprise. В open-core этих роутов НЕТ ВООБЩЕ (пакет escrow
  # не собирается) — не 501, а 404: в свободной сборке нет ни кода, ни age в графе.
  # Сервер отдаёт ШИФРТЕКСТ: расшифровать он не может (инвариант TestServerHasNoDecrypt),
  # открывает оператор офлайн утилитой routineops-unseal шерами приватного ключа.

  /api/v1/devices/{id}/escrow:
    x-enterprise: true
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    get:
      tags: [Устройства]
      summary: Заэскроенные секреты устройства (метаданные)
      description: |
        Роль: `it_admin`, только человек. Шифртекста в ответе НЕТ — он только в `reveal`.
        `latest=true` — строка, которую отдаст выгрузка для своего `secret_type`.
      x-requires-human: true
      responses:
        '200':
          description: Список строк эскроу, свежие первыми
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EscrowRecord' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { description: Возможность Enterprise — в этой сборке роут отсутствует }

  /api/v1/devices/{id}/escrow/reveal:
    x-enterprise: true
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Устройства]
      summary: Выгрузка заэскроенного секрета (шифртекст)
      description: |
        Роль: `it_admin`, только человек, СВЕРХ ТОГО — живой грант
        `users.can_reveal_escrow` (ADR-F16: выдаётся out-of-band через psql, роли для
        него нет). Проверка гранта fail-closed: ошибка БД = отказ (500, не 403 — чтобы
        оператор не искал грант, который у него уже есть).

        Отдаётся САМАЯ СВЕЖАЯ строка `(device_id, secret_type)`: re-run provisioning
        штатно ротирует PRK/пароль, старые строки не инвалидируются, и выдача устаревшей
        привела бы к тому, что lock-time preflight отвергнет секрет, а FileVault-лок
        машины начнёт молча отказывать.

        `recipient_fpr` строки сверяется с запиненным на КАЖДУЮ выгрузку: несовпадение
        (ротация recipient либо подмена строки) = 409, потому что иначе оператор получит
        файл, который нечем открыть, и узнает об этом в момент инцидента.

        **Во время сеанса удалённого стола по этому устройству — 409** (контракт §5):
        иначе оператор откроет ключ прямо в кадре и тот ляжет в видеозапись, у которой
        свой режим доступа. Сеансом считается и ещё не принятый (`requested`): согласие
        может прийти через секунду после того, как ключ окажется на экране.

        Выгрузка и каждый отказ пишутся в аудит (`reveal_escrow` / `reveal_escrow_denied`).
      x-requires-human: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret_type:
                  type: string
                  enum: [prk, secondary_cred]
                  default: prk
      responses:
        '200':
          description: Шифртекст самой свежей строки
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EscrowRecord'
                  - type: object
                    properties:
                      device_id:
                        type: string
                        format: uuid
                        description: Нужен routineops-unseal для сверки device-binding, вложенного в конверт
                      ciphertext_b64:
                        type: string
                        description: age-blob как есть, base64
        '400': { description: Неизвестный secret_type }
        '403': { description: Нет роли, сервисный токен либо нет гранта can_reveal_escrow }
        '404': { description: Строки эскроу нет (или роут отсутствует — сборка не Enterprise) }
        '409': { description: 'recipient строки не совпал с запиненным, либо по устройству идёт сеанс удалённого стола (контракт §5)' }

  /api/v1/devices/{id}/screen-sessions:
    x-enterprise: true
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Устройства]
      summary: Запросить интерактивный сеанс с экраном (ADR-8)
      description: |
        Роль: `it_admin`, только человек — как и ВСЕ ручки `screen-*`, без исключений.
        Сервисный токен несёт роль, зафиксированную при выпуске; наблюдение за экраном
        сотрудника автоматикой не запрашивают.

        **Повод обязателен.** Оператор, которому нечего написать, не имеет причины
        подключаться, и в режиме `unattended` повод — единственное, что объясняет
        наблюдение постфактум.

        Порядок проверок: устройство активно → агент ОБЪЯВИЛ способность
        (`devices.capabilities`, версии для этого мало: free-сборка той же версии
        удалённого стола не содержит вовсе) → агент на связи. Только потом заводится
        строка сеанса — иначе журнал заполнялся бы сеансами, которых не было.

        Приглашение уходит подключённому агенту НЕМЕДЛЕННО, минуя очередь: задача,
        доставленная через минуту, хуже честного `409 device_offline`.

        Строка сеанса, задача-приглашение и строка аудита `screen_session_requested`
        пишутся ОДНОЙ транзакцией. Не записался аудит — нет ни сеанса, ни приглашения:
        сеанс наблюдения, о котором не осталось следа, — ровно то, ради предотвращения
        чего фича и проектировалась.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Повод; уходит в аудит и (в режиме consent_required) показывается сотруднику
                control:
                  type: boolean
                  default: false
                  description: |
                    Запросить сеанс С УПРАВЛЕНИЕМ: оператор сможет двигать мышь и нажимать
                    клавиши от имени сотрудника.

                    Объявляется ЗДЕСЬ и больше нигде. Область сеанса фиксируется
                    приглашением и на лету не расширяется, поэтому ручки «взять управление
                    посреди наблюдения» не существует — это всегда новый сеанс с новой
                    строкой аудита. Обратное (вернуть управление) возможно и необратимо.

                    Порождает отдельную строку аудита `screen_session_control_granted` и
                    меняет текст, который видит сотрудник: плашка и диалог согласия
                    говорят про управление, а не про просмотр.
      responses:
        '201':
          description: Сеанс создан, приглашение доставлено агенту
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenSession' }
        '400': { description: Повод не задан }
        '403': { description: Нет роли либо сервисный токен }
        '404': { description: Устройства нет, оно не активно или чужого тенанта (роут отсутствует — сборка не Enterprise) }
        '409': { description: 'device_offline — агент не на связи; agent_unsupported — агент не умеет удалённый стол; agent_no_control — агент не умеет управление (способность screen_input объявляется отдельно от screen_session, иначе старый агент умер бы с SCOPE_VIOLATION на первой пачке ввода); recording_quota_exhausted — исчерпан объём записей тенанта' }
        '500': { description: Не записался аудит — сеанс не создан (fail-closed) }
    get:
      tags: [Устройства]
      summary: Журнал сеансов устройства
      description: |
        Роль: `it_admin`, только человек. Журнал — часть контракта, а не удобство: сеанс
        обязан быть виден в карточке устройства постфактум, с оператором, поводом,
