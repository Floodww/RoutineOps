openapi: 3.0.3

info:
  title: RoutineOps Server API
  version: 2.4.6
  description: |
    HTTP API сервера RoutineOps — точка интеграции для автоматизации и сторонних
    интерфейсов. Веб-интерфейс из поставки использует этот же API, отдельного
    приватного канала у него нет.

    ## Аутентификация

    Два равноправных способа, оба проверяются одним middleware:

    * **Cookie `token`** — httpOnly-кука, выставляется `POST /api/v1/auth/login`.
      Так работает веб-интерфейс.
    * **`Authorization: Bearer <token>`** — сервисный API-токен для автоматизации.
      Выпускается через `POST /api/v1/api-tokens`, показывается ОДИН раз в ответе.

    ## Роли

    * `viewer` — чтение.
    * `it_admin` — чтение и изменение.

    ## Операции «только человеком»

    Часть операций помечена `x-requires-human: true`. Они доступны только под
    учётной записью человека и отвечают `403` на сервисный токен, даже если у
    токена роль `it_admin`. Правило распространяется на всё, что выпускает или
    повышает права: приглашение пользователя, выпуск API-токена и токена
    энроллмента, одобрение устройства и запроса локальных админ-прав, вывод
    устройства из эксплуатации.

    Смысл в том, что иначе модель отзыва была бы фикцией: утёкший токен выписал
    бы себе новый, который пережил бы удаление исходного.

    ## Ошибки

    Тело ошибки — `text/plain` с короткой строкой, не JSON. Значим код ответа.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://mdm.example.com
    description: Ваш сервер RoutineOps

tags:
  - name: Аутентификация
  - name: Устройства
  - name: Энроллмент
  - name: Задачи
  - name: Блокировка
  - name: Скрипты
  - name: Скрипт-политики
  - name: Софт-политики
  - name: Группы устройств
  - name: Алерты
  - name: Локальные админ-права
  - name: Пользователи
  - name: API-токены
  - name: Каталог
  - name: Аудит
  - name: Служебное

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ─────────────────────────── Аутентификация ───────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Аутентификация]
      summary: Вход по email и паролю
      description: |
        Выставляет httpOnly-куку `token`. Ограничение: 10 запросов в минуту с одного IP.
        Дополнительно действует счётчик неудачных попыток на учётную запись.

        Пароль проверяется сначала локально. Если он не сошёлся, а каталог включён с
        `login_enabled` (Enterprise), пара проверяется по LDAP/AD. Порядок именно такой:
        локальный пароль обязан работать при отключённой в домене учётке и при
        недоступном контроллере домена, иначе падение AD запирало бы панель целиком.
        По этой же причине доступ отзывается удалением пользователя, а не отключением
        учётки в домене. Каталог только подтверждает пароль: учётных записей он не
        создаёт и роль из групп AD не назначает — роль остаётся локальной. Использованный
        способ пишется в аудит (`method`: `local` либо `ldap`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Вход выполнен, кука выставлена
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`token=<jwt>; HttpOnly; Secure; SameSite=Strict`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Неверные учётные данные
          content: { text/plain: { schema: { type: string } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/logout:
    post:
      tags: [Аутентификация]
      summary: Выход
      description: Гасит куку `token`.
      security: []
      responses:
        '200': { description: Кука погашена }

  /api/v1/auth/forgot-password:
    post:
      tags: [Аутентификация]
      summary: Запрос ссылки на сброс пароля
      description: |
        Всегда отвечает `200` независимо от существования адреса — чтобы по ответу
        нельзя было перебирать учётные записи. Ограничение: 5 запросов в минуту с IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Запрос принят }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/reset-password:
    post:
      tags: [Аутентификация]
      summary: Установка нового пароля по токену из письма
      description: 'Ограничение: 10 запросов в минуту с IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Пароль изменён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/invite:
    get:
      tags: [Аутентификация]
      summary: Проверка токена приглашения
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Приглашение действительно
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
                  role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/accept-invite:
    post:
      tags: [Аутентификация]
      summary: Создание учётной записи по приглашению
      description: 'Ограничение: 10 запросов в минуту с IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Учётная запись создана }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/me:
    get:
      tags: [Аутентификация]
      summary: Текущая личность и роль
      description: |
        Источник роли для гейтинга интерфейса. Под сервисным токеном отдаёт личность
        и роль САМОГО токена, а не создавшего его администратора.
      responses:
        '200':
          description: Личность
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/password:
    post:
      tags: [Аутентификация]
      summary: Смена собственного пароля
      description: Гасит все живые сессии владельца.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '200': { description: Пароль изменён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/profile/telegram:
    get:
      tags: [Аутентификация]
      summary: Состояние привязки Telegram
      description: |
        Отдаёт непогашенный токен привязки ВЛАДЕЛЬЦА учётной записи, поэтому закрыт
        для сервисных токенов: иначе держатель токена скормил бы его боту и начал
        получать чужие алерты.
      x-requires-human: true
      responses:
        '200':
          description: Состояние привязки
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: { type: boolean }
                  link_token: { type: string }
                  bot_username: { type: string }
                  min_severity:
                    type: string
                    enum: [critical, high, medium, low]
                    description: Порог доставки уведомлений владельца учётной записи.
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/profile/notify-min-severity:
    post:
      tags: [Аутентификация]
      summary: Порог доставки уведомлений
      description: |
        Меняет минимальную критичность алертов, о которых владелец учётной записи
        получает уведомление в Telegram. Алерты ниже порога остаются в панели, но
        не рассылаются.

        Личная настройка, а не административная: решать за коллегу, каких алертов
        ему не видеть, не должен никто. Отсюда же закрытость для сервисных токенов —
        у токена нет личности, и он менял бы настройку создавшего его администратора.

        Неизвестный уровень отклоняется с 400, а не подставляется значением по
        умолчанию: молчаливая подстановка превратила бы опечатку в тихое отключение
        части уведомлений, которое ничем себя не проявляет.
      x-requires-human: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_severity]
              properties:
                min_severity:
                  type: string
                  enum: [critical, high, medium, low]
      responses:
        '200':
          description: Порог сохранён
          content:
            application/json:
              schema:
                type: object
                properties:
                  min_severity: { type: string }
        '400': { description: Неизвестный уровень критичности }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/profile/telegram-link:
    post:
      tags: [Аутентификация]
      summary: Выпуск токена привязки Telegram
      description: 'Роль: `it_admin`. Привязка — личное действие человека.'
      x-requires-human: true
      responses:
        '200':
          description: Токен привязки
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  # ─────────────────────────── Устройства ───────────────────────────
  /api/v1/devices:
    get:
      tags: [Устройства]
      summary: Список устройств
      description: |
        Поля расширенного инвентаря (`arch`, `console_user`, `disk_encryption`,
        `os_patch_date`, `boot_time`, `disk_free`, `domain_joined`, `tpm`,
        `secure_boot`) в списке НЕ заполняются — они приходят в карточке устройства.

        Выдача постраничная: тело — страница, общее число устройств под фильтром
        отдаётся заголовком `X-Total-Count`. Устройства в статусе `pending` в
        список не попадают.
      parameters:
        - name: q
          in: query
          description: |
            Поиск по подстроке любого собираемого атрибута: имя, ОС, IP (внутренний
            и внешний), MAC, серийник, CPU, диск, версия агента, CN сертификата, id.
            MAC и серийник сравниваются и без разделителей. Длиннее 128 символов —
            обрезается.
          schema: { type: string, maxLength: 128 }
        - name: group_id
          in: query
          description: Только члены этой группы. Не-UUID даёт пустую выдачу, а не ошибку.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Устройства
          headers:
            X-Total-Count: { $ref: '#/components/headers/TotalCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Устройства]
      summary: Регистрация устройства и выпуск одноразового токена энроллмента
      description: 'Роль: `it_admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string }
                os: { $ref: '#/components/schemas/OS' }
      responses:
        '201':
          description: Устройство создано в статусе `pending`
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  enrollment_token: { type: string }
                  ca_sha256:
                    type: string
                    description: Отпечаток CA для пиннинга при энроллменте агента
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/devices/across-tenants:
    get:
      tags: [Устройства]
      summary: Список устройств по всем тенантам
      description: |
        Роль: `provider_admin`. Только учётная запись человека (`x-requires-human`).
        Перед выдачей пишет событие аудита `devices.list_across_tenants`. Параметры
        поиска и пагинации те же, что у `GET /api/v1/devices`.
      x-requires-human: true
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
        - name: group_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Устройства
          headers:
            X-Total-Count: { $ref: '#/components/headers/TotalCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/devices/{id}:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    get:
      tags: [Устройства]
      summary: Карточка устройства
      responses:
        '200':
          description: Устройство
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Устройства]
      summary: Удаление устройства из базы
      description: |
        Роль: `it_admin`. Удаляет запись и всё связанное каскадом и в той же
        транзакции отзывает сертификат устройства (тумбстоун отпечатка): живой агент
        удалённого устройства больше не «воскресит» его пустой записью при следующем
        подключении. Ре-энролл по новому токену выпускает новый сертификат и проходит.
        Агента на машине НЕ трогает — для этого есть вывод из эксплуатации; веб-интерфейс
        предлагает удаление только для уже выведенных из эксплуатации устройств.
      responses:
        '204': { description: Удалено }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/owner:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    put:
      tags: [Устройства]
      summary: Привязка владельца устройства
      description: |
        Роль: `it_admin`. Владелец — КАРТОЧКА ЧЕЛОВЕКА (`Person`), а не аккаунт панели:
        аккаунты нужны тем, кто в панель ходит (админы, поддержка), а сотруднику ради
        закреплённого за ним ноутбука вход не нужен.

        Карточка может быть заведена вручную (`POST /persons`, Free) или принесена
        синком каталога (Enterprise) — для устройства это один и тот же владелец.
        Пустой `person_id` снимает владельца.

        Назначенный здесь владелец синком НЕ затирается: авто-матч каталога заполняет
        только устройства без владельца.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person_id]
              properties:
                person_id:
                  type: string
                  description: UUID карточки человека; пустая строка снимает владельца
      responses:
        '204': { description: Владелец обновлён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/persons:
    post:
      tags: [Устройства]
      summary: Завести карточку человека (владельца)
      description: |
        Роль: `it_admin`. Заводит человека, за которым числятся устройства. Приглашение
        НЕ отправляется и аккаунт не создаётся: вход в панель владельцу не нужен.

        `display_name` обязателен — карточка без имени нечитаема в списке владельцев.
        `email` необязателен (корпоративная почта есть не у всех), но если задан, то
        разбирается как адрес.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 320 }
      responses:
        '201':
          description: Карточка заведена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Устройства]
      summary: Правка карточки человека
      description: |
        Роль: `it_admin`. Только для карточек, заведённых вручную (`source: manual`).
        Карточку из каталога правят в AD — 409: правка здесь пережила бы ровно до
        следующего синка, и оператор решил бы, что панель его не слушает.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 320 }
      responses:
        '204': { description: Обновлено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Карточка из каталога — правится в AD }
    delete:
      tags: [Устройства]
      summary: Удаление карточки человека
      description: |
        Роль: `it_admin`. Только для карточек `source: manual`. Устройства, где карточка
        стояла владельцем, остаются без владельца — сами машины не затрагиваются.
      responses:
        '204': { description: Удалено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Карточка из каталога — удаляется в AD }

  /api/v1/devices/{id}/status:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    put:
      tags: [Устройства]
      summary: Смена статуса устройства
      description: |
        Роль: `it_admin`. Перевод в управляемый статус из очереди одобрения этой
        ручкой невозможен — для этого есть одобрение.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DeviceStatus' }
      responses:
        '200': { description: Статус изменён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/devices/{id}/decommission:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Устройства]
      summary: Вывод устройства из эксплуатации
      description: |
        Роль: `it_admin`. Необратимо. Агент снимает службу, разоружает защиту от
        вмешательства, удаляет состояние, сертификат и собственный бинарь.
        Статус переходит в терминальный `decommissioned` только после подтверждения
        от агента, то есть операция требует его сотрудничества. Для враждебного или
        украденного устройства используйте блокировку — она применяется на сервере
        мгновенно.
      x-requires-human: true
      responses:
        '202': { description: Команда поставлена в очередь агенту }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/reboot:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Устройства]
      summary: Перезагрузка устройства
      description: |
        Роль: `it_admin`. Устройство должно быть `active` (иначе 409): остальные
        состояния Connect не примет, и задача висела бы недоставленной.

        Успешный ответ означает «перезагрузка ЗАПЛАНИРОВАНА»: агент отчитывается
        сразу после того, как планировщик ОС принял команду, а не после того, как
        машина поднялась. Отмены запланированной перезагрузки нет.

        Повторный вызов при недоставленной заявке возвращает ТУ ЖЕ задачу. Новый
        `task_id` для того же намерения означал бы вторую перезагрузку: агент
        дедуплицирует durably по `task_id` и переживает перезагрузку, поэтому чужой
        id для него — новая команда, и устройство уходит в цикл.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: На Windows показывается сотруднику в системном предупреждении; всегда попадает в аудит.
                delay_seconds:
                  type: integer
                  description: >
                    Отсрочка. `0` (или поле не задано) = ДЕФОЛТ АГЕНТА (60 с), а НЕ
                    «сейчас»: нулевое значение никогда не должно быть самым
                    деструктивным вариантом. Значение от 1 до 9 поднимается до 10 —
                    меньшего агент не примет. На macOS и Linux отсрочка округляется
                    вверх до целых минут (секундной гранулярности в планировщике нет).
      responses:
        '200':
          description: Задача поставлена (или возвращена уже существующая)
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string, format: uuid }
                  delay_seconds: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Устройство не в состоянии `active` }

  /api/v1/device-groups/{id}/reboot:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Группы устройств]
      summary: Перезагрузка всех устройств группы
      description: |
        Роль: `it_admin`. Команда уходит только `active`-устройствам группы.
        Потолок — 50 машин за раз (422 сверх него): одним кликом иначе можно уронить
        парк в рабочее время. `expected_devices` — число машин, которое панель
        показала оператору; расхождение с фактом даёт 409, потому что подтверждали
        не тот масштаб.

        `created` может быть меньше `in_scope`: устройствам с уже недоставленной
        заявкой вторую не заводим.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                delay_seconds: { type: integer, description: 'Как у одиночной перезагрузки; 0 = дефолт агента (60 с)' }
                expected_devices: { type: integer, description: 'Подтверждённое оператором число active-машин группы' }
      responses:
        '201':
          description: Веер поставлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  in_scope: { type: integer }
                  delay_seconds: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Состав группы изменился с момента подтверждения }
        '422': { description: В группе больше 50 active-устройств }

  # ─────────────────────────── Энроллмент ───────────────────────────
  /api/v1/enroll:
    post:
      tags: [Энроллмент]
      summary: Энроллмент агента (вызывает агент, не оператор)
      description: |
        Агент присылает CSR и одноразовый либо массовый токен, получает подписанный
        сертификат. Аутентификация — самим токеном, поэтому эндпоинт публичный.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token, csr_pem]
              properties:
                enrollment_token: { type: string }
                csr_pem: { type: string }
                hostname: { type: string }
                os: { $ref: '#/components/schemas/OS' }
                arch: { type: string, example: amd64 }
      responses:
        '200':
          description: Сертификат выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate_pem: { type: string }
                  ca_pem: { type: string }
                  device_id: { type: string, format: uuid }
                  release_pubkey:
                    type: string
                    description: Публичный ключ проверки самообновления агента
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Токен недействителен или уже использован
          content: { text/plain: { schema: { type: string } } }

  /api/v1/devices/{id}/enrollment-token:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    get:
      tags: [Энроллмент]
      summary: Действующий одноразовый токен устройства
      description: 'Роль: `it_admin`.'
      responses:
        '200':
          description: Токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/reenroll:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Энроллмент]
      summary: Повторный энроллмент — выпуск нового токена
      description: |
        Роль: `it_admin`. Отклонённое или заблокированное устройство повторным
        энроллментом в управляемый статус не возвращается — требуется одобрение.
      responses:
        '200':
          description: Новый токен выпущен
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment_token: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Статус устройства запрещает повторный энроллмент
          content: { text/plain: { schema: { type: string } } }

  /api/v1/enrollment-tokens/bulk:
    post:
      tags: [Энроллмент]
      summary: Выпуск массового токена энроллмента
      description: |
        Роль: `it_admin`. Один токен на партию машин — для развёртывания образом или
        через систему раздачи ПО.
      x-requires-human: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: string
                  format: uuid
                  description: Пусто — без группы
                max_uses:
                  type: integer
                  nullable: true
                  description: Не задано — без ограничения до истечения срока
                require_approval:
                  type: boolean
                  nullable: true
                  default: true
                  description: Ставить ли энроллящиеся устройства в очередь одобрения
                ttl_hours:
                  type: integer
                  description: 0 — значение по умолчанию
      responses:
        '201':
          description: Токен выпущен
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
    get:
      tags: [Энроллмент]
      summary: Список выпущенных массовых токенов
      description: |
        Роль: `it_admin`. Самого токена в ответе нет — в базе хранится только его
        отпечаток. Отдаёт и истёкшие/отозванные: важно видеть, чем энроллили парк.
      responses:
        '200':
          description: Токены, свежие сверху
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    group_id: { type: string }
                    group_name: { type: string }
                    max_uses: { type: integer, nullable: true }
                    uses: { type: integer }
                    require_approval: { type: boolean }
                    expires_at: { type: string, format: date-time }
                    created_at: { type: string, format: date-time }

  /api/v1/enrollment-tokens/{id}:
    delete:
      tags: [Энроллмент]
      summary: Отзыв токена энроллмента
      description: |
        Роль: `it_admin`. Гасит токен немедленно (срок сдвигается в прошлое) — новые
        машины по нему не заведутся, уже заведённые остаются в парке. Защитное
        действие, поэтому сервисному токену разрешено.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Отозван }
        '400': { description: Некорректный идентификатор }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Токен не найден или уже недействителен }

  /api/v1/devices/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Энроллмент]
      summary: Одобрение устройства из очереди
      description: 'Роль: `it_admin`. Переводит `pending_approval` в управляемый статус.'
      x-requires-human: true
      responses:
        '200': { description: Одобрено }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Энроллмент]
      summary: Отклонение устройства из очереди
      description: |
        Роль: `it_admin`. Защитное действие, поэтому сервисному токену разрешено.
      responses:
        '200': { description: Отклонено }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/enrollment-queue/approve:
    post:
      tags: [Энроллмент]
      summary: Пакетное одобрение очереди
      description: 'Роль: `it_admin`.'
      x-requires-human: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: string
                  description: Пусто — все устройства в статусе `pending_approval`
      responses:
        '200':
          description: Результат пакета
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: integer }
        '403': { $ref: '#/components/responses/ForbiddenHuman' }

  /api/v1/enrollment-queue/reject:
    post:
      tags: [Энроллмент]
      summary: Пакетное отклонение очереди
      description: 'Роль: `it_admin`. Защитное действие, сервисному токену разрешено.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id: { type: string }
      responses:
        '200':
          description: Результат пакета
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Задачи ───────────────────────────
  /api/v1/devices/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    get:
      tags: [Задачи]
      summary: Задачи устройства
      responses:
        '200':
          description: Задачи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Задачи]
      summary: Разовый запуск скрипта на устройстве
      description: |
        Роль: `it_admin`. Содержимое исполняется на устройстве с правами службы
        агента (root или SYSTEM). Это самый мощный канал в системе — доступ к нему
        равносилен удалённому исполнению кода на всём парке.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script_content, platform]
              properties:
                script_content: { type: string }
                platform: { $ref: '#/components/schemas/OS' }
                priority: { $ref: '#/components/schemas/Priority' }
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Блокировка ───────────────────────────
  /api/v1/devices/{id}/lock:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Блокировка]
      summary: Блокировка устройства
      description: |
        Роль: `it_admin`. Сервер генерирует одноразовый пароль снятия, отдаёт его
        оператору в открытом виде и передаёт агенту только хеш. Пароль показывается
        один раз, восстановить его нельзя.

        Режим `filevault` — возможность редакции Enterprise и требует настроенного
        эскроу ключей восстановления; в свободной редакции запрос вернёт `409`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Текст, который увидит сотрудник на экране блокировки
                mode: { $ref: '#/components/schemas/LockMode' }
      responses:
        '200':
          description: Команда поставлена агенту
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string, format: uuid }
                  password:
                    type: string
                    description: Пароль снятия. Показывается ОДИН раз.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Режим блокировки недоступен (возможность Enterprise либо эскроу выключен)
          content: { text/plain: { schema: { type: string } } }

  /api/v1/devices/{id}/unlock:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Блокировка]
      summary: Снятие блокировки
      description: 'Роль: `it_admin`.'
      responses:
        '200':
          description: Команда поставлена агенту
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Скрипты ───────────────────────────
  /api/v1/scripts:
    get:
      tags: [Скрипты]
      summary: Библиотека скриптов
      responses:
        '200':
          description: Скрипты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Script' }
    post:
      tags: [Скрипты]
      summary: Создание скрипта
      description: 'Роль: `it_admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScriptInput' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/scripts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Скрипты]
      summary: Скрипт
      responses:
        '200':
          description: Скрипт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Скрипты]
      summary: Изменение скрипта
      description: 'Роль: `it_admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScriptInput' }
      responses:
        '200': { description: Изменён }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Скрипты]
      summary: Удаление скрипта
      description: 'Роль: `it_admin`. Скрипт, на который ссылается скрипт-политика, не удаляется.'
      responses:
        '204': { description: Удалён }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Скрипт используется скрипт-политикой
          content: { text/plain: { schema: { type: string } } }

  # ─────────────────────────── Скрипт-политики ───────────────────────────
  /api/v1/script-policies:
    get:
      tags: [Скрипт-политики]
      summary: Скрипт-политики
      description: |
        Политика с пустым `group_names` не таргетит ни одно устройство и молча не
        выполняется — при разборе «политика не отработала» смотрите сюда первым делом.
      responses:
        '200':
          description: Политики
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScriptPolicy' }
    post:
      tags: [Скрипт-политики]
      summary: Создание скрипт-политики
      description: 'Роль: `it_admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, script_id, trigger_type]
              properties:
                name: { type: string }
                script_id: { type: string, format: uuid }
                trigger_type: { $ref: '#/components/schemas/TriggerType' }
                schedule_config:
                  type: object
                  description: Для `schedule` — расписание запуска
                event_trigger_config:
                  type: object
                  description: Для `event` — на какие события реагировать
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/script-policies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Скрипт-политики]
      summary: Обновление скрипт-политики
      description: |
        Роль: `it_admin`. Переписывает политику целиком, кроме `is_active` (для него
        отдельная ручка `toggle`). Нужен идемпотентному `routineops apply`: без него
        правка расписания шла бы через удаление и создание, то есть новый `id` —
        назначения групп отвалились бы, а история результатов потерялась.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, script_id, trigger_type]
              properties:
                name: { type: string }
                script_id: { type: string, format: uuid }
                trigger_type: { $ref: '#/components/schemas/TriggerType' }
                schedule_config: { type: object }
                event_trigger_config: { type: object }
      responses:
        '200':
          description: Обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptPolicy' }
        '400': { description: Некорректный триггер или cron-выражение }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Имя политики занято }
    delete:
      tags: [Скрипт-политики]
      summary: Удаление скрипт-политики
      description: 'Роль: `it_admin`.'
      responses:
        '204': { description: Удалена }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/script-policies/{id}/toggle:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Скрипт-политики]
      summary: Включение и выключение политики
      description: 'Роль: `it_admin`.'
      responses:
        '200':
          description: Новое состояние
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_active: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/script-policies/compliance:
    get:
      tags: [Скрипт-политики]
      summary: Сводка выполнения по всем скрипт-политикам
      responses:
        '200':
          description: Сводка
          content:
