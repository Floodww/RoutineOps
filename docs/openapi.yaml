            application/json:
              schema: { $ref: '#/components/schemas/ComplianceReport' }

  /api/v1/compliance/report.csv:
    get:
      tags: [Соответствие]
      summary: Тот же отчёт файлом
      description: >-
        CSV с BOM — иначе Excel портит кириллицу. Язык заголовков, ответов «да/нет» и
        формулировок причин берётся из `lang`, затем из `Accept-Language`, затем
        русский. Разделитель меняется ВМЕСТЕ с языком (`;` для ru, `,` для en): Excel
        берёт разделитель списка из системной локали, и одна зашитая запятая
        складывает отчёт в одну колонку у половины операторов. PDF не генерируется
        сервером: страницу отчёта печатает браузер.
      parameters:
