name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменять устаревший прогон при новом пуше — только для PR/веток.
# На main НЕ отменяем: каждый коммит в main должен полностью пройти проверки
# (частые пуши не должны гасить длинную race-джобу предыдущего коммита).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: vet · build · test (race)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdm_test
          POSTGRES_USER: mdm
          POSTGRES_PASSWORD: mdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdm -d mdm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (должно быть пусто)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Не отформатировано (gofmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Гарды доков: оба скрипта объявляли себя CI-гардами, но не запускались нигде.
      # Публичный док-срез — существование файлов whitelist, leak-паттерны, замкнутость
      # ссылок. Спецификация API — резолвимость $ref и совпадение набора эндпоинтов
      # с маршрутами в коде (руками написанная спека тихо расходится именно так).
      - name: guards (публичные доки · спецификация API)
        run: |
          # PyYAML — зависимость check-openapi.sh, объявляем её ЯВНО. Раньше гард
          # молча полагался на то, что она случайно есть в образе ubuntu-latest: при
          # её отсутствии он печатал «ПРОПУСК» и выходил с кодом 0, то есть проверял
          # ноль. Теперь скрипт fail-closed, и без этой строки любое обновление
          # образа или добавление setup-python роняло бы весь пайплайн.
          # Ставим системным пакетом, а НЕ `pip install`: с PEP 668 интерпретатор в
          # свежих образах помечен externally-managed, и pip в него отказывается
          # ставить (error: externally-managed-environment) — фолбэк сработал бы
          # ровно в тот момент, когда он нужен, и уронил бы пайплайн вместо починки.
          python3 -c 'import yaml' 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 -c 'import yaml' || { echo "PyYAML недоступен — гард спецификации API не может работать" >&2; exit 1; }
          # check-public-docs.sh и его whitelist вырезаются из Free-среза
          # (export-free.sh, шаг 4) — это мейнтейнерский тулинг. В срезе гард
          # и не нужен: он проверяет список, по которому срез и сделан.
          if [ -f scripts/check-public-docs.sh ]; then
            bash scripts/check-public-docs.sh
          else
            echo "check-public-docs.sh отсутствует (Free-срез) — пропуск"
          fi
          bash scripts/check-openapi.sh

      # Guard open-core: canary-либы (age → escrow, go-ldap → каталог) и enterprise-пакеты
      # не должны попадать в граф зависимостей шипаемых free-бинарей. Job собирается БЕЗ
      # -tags enterprise, то есть ровно в той конфигурации, которую гард и проверяет.
      # До сих пор запускался только руками перед пушем (server/README.md), а пушим мы
      # прямо в main — между «забыл прогнать» и enterprise-кодом в публичном репозитории
      # не было ни одного автоматического барьера.
      - name: leak-guard (enterprise → open-core)
        run: sh scripts/check-oss-no-enterprise.sh

      # Тот же класс проблемы, что и у гардов выше, только по другой оси: leak-скан
      # Free-среза (имена, внутренние хосты/IP, процесс-ссылки на приватные доки) жил
      # ТОЛЬКО внутри export-free.sh, а тот гоняется руками и лишь перед публикацией.
      # Утечки поэтому копились неделями и всплывали пачкой: 28.07 один прогон дал
      # сразу четыре блокера — комментарии и одна тестовая константа, каждый из
      # которых стоил бы минуты, поймай его коммит-в-коммит.
      # --scan-only делает срез (шаги 1-4b) и гоняет V1/V4/V4b — чистая работа с
      # текстом: ни protoc, ни npm, ни сборки. Про НЕпокрытое (V4c, бинари) шаг
      # печатает явно — «leak-скан» в логе не должен читаться как «проверено всё».
      - name: leak-скан Free-среза (утечки в публичный код)
        run: bash scripts/export-free.sh --scan-only

      # Регрессия из поля (13.07): install.sh был идемпотентен настолько, что
      # ИСПРАВЛЕННЫЙ адрес сервера никуда не доезжал — опечатка в цифре IP стоила дня.
      # Тест закрывает и обратную половину (CA, секреты и БД трогать нельзя), но до
      # сих пор запускался руками. Docker и hostname в нём заглушки, нужен только
      # bash+openssl — на раннере это секунды.
      - name: install.sh — реконсиляция адресов и секретов
        run: bash scripts/test-install-readdress.sh

      - name: build
        run: go build ./...

      - name: test (race) + coverage gate
        env:
          TEST_POSTGRES_DSN: postgres://mdm:mdm@localhost:5432/mdm_test?sslmode=disable
        run: |
          # -coverpkg=./... инструментирует все пакеты модуля при каждом тест-бинаре,
          # поэтому интеграционные тесты (gateway→storage и т.п.) считаются в агрегате.
          # Из-за -coverpkg один и тот же файл/строка попадает в coverage.out НЕСКОЛЬКО
          # раз (по разу на каждый тест-бинарь, который его инструментирует) — ниже
          # блоки мержатся по (file:range) суммированием count ДО подсчёта процентов,
          # иначе total задваивается/затраивается и проценты становятся бессмысленными.
          go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

          # ── Aggregate 70% + per-package floor 55% (единый проход) ─────────
          # Пакеты, где ветки физически недостижимы на linux CI, и инфра-пакеты
          # без бизнес-логики исключаются из ОБОИХ гейтов (раньше исключения были
          # только в per-package и не применялись к агрегату):
          #   status   — windows DefaultPath + fs-error ветки Write
          #   service  — launchd/SCM install paths
          #   keystore — CGO Security.framework / Windows NCrypt
          #   mailer   — SMTP без внешнего сервиса не тестируется
          #   cmd/*, proto, testutil, node_modules — инфра/генерённый код
          LC_ALL=C awk '
            NR == 1 { next }
            {
              key = $1
              stmt[key] = $2 + 0
              cnt[key] += $3 + 0
            }
            END {
              for (key in stmt) {
                split(key, a, ":"); file = a[1]
                n = split(file, p, "/"); pkg = ""
                for (i = 1; i < n; i++) pkg = (pkg == "") ? p[i] : pkg "/" p[i]
                total[pkg] += stmt[key]
                if (cnt[key] > 0) covered[pkg] += stmt[key]
              }
              fail = 0
              grand_total = 0; grand_covered = 0
              for (pkg in total) {
                if (total[pkg] == 0) continue
                if (pkg ~ /\/(status|service|keystore|mailer)$/) continue
                if (pkg ~ /\/(testutil|proto)$/) continue
                if (pkg ~ /\/cmd\//) continue
                if (pkg ~ /node_modules/) continue
                grand_total += total[pkg]
                grand_covered += covered[pkg]
                pct = covered[pkg] / total[pkg] * 100
                if (pct < 55) {
                  printf "FAIL: %s %.1f%% < 55%% floor\n", pkg, pct
                  fail = 1
                }
              }
              agg = grand_covered / grand_total * 100
              printf "Coverage aggregate (excl. platform/infra pkgs): %.1f%%\n", agg
              if (agg < 70) { printf "FAIL: aggregate %.1f%% < 70%%\n", agg; fail = 1 }
              else print "OK: aggregate gate passed"
              exit fail
            }' coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test-windows:
    name: test (windows · cert store)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Runtime-проверка Windows Certificate Store провайдера (NCrypt-подпись):
      # платформенный код, который нельзя прогнать на ubuntu/macOS. Интеграционный
      # тест сам создаёт/чистит самоподписанный серт с CNG-ключом в CurrentUser\My.
      - name: test keystore (windows)
        run: go test -v -timeout 2m ./internal/agent/keystore/...

      # Windows-tagged тесты decommission (батч-делетер, resolveInstallDir, контракт с
      # именем службы) не компилируются на ubuntu, поэтому в основном job не гоняются
      # вообще — без этого шага регрессия сноса ловилась бы только руками на стенде.
      - name: test decommission (windows)
        run: go test -v -timeout 2m ./internal/agent/decommission/...

  windows-msi:
    name: windows · MSI build + install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Сборка MSI-инсталлятора (WiX v4) — валидатор корректности авторинга.
      # enroll требует живого сервера, поэтому ставим без токена (раскладка
      # файлов), а регистрацию службы в SCM проверяем прямым `agent install`.
      - name: build agent.exe (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o installer/windows/agent.exe ./cmd/agent

      - name: stub ca.crt для упаковки
        shell: pwsh
        run: Set-Content -Path installer/windows/ca.crt -Value "MDM-CI-PLACEHOLDER-CA"

      - name: install WiX
        # Пин на v4 (схема agent.wxs — v4/wxs). v6+/v7 требуют принятия OSMF EULA
        # и валятся в CI (WIX7015).
        run: dotnet tool install --global wix --version 4.0.5

      - name: wix build agent.msi
        # -arch x64: иначе пакет x86 и ProgramFiles64Folder уезжает в Program Files (x86).
        run: wix build installer/windows/agent.wxs -arch x64 -d Version=0.0.0 -d AgentExe=installer/windows/agent.exe -d CaCert=installer/windows/ca.crt -o agent.msi

      # До сих пор CI собирал ТОЛЬКО валидатор — файл, который никуда не едет.
      # Боевой авторинг (build/msi/mdm-agent.wxs, его собирает build-msi.ps1) не
      # проверялся ничем, хотя именно он уходит на парк: опечатка в нём всплывала
      # бы на релизной сборке, а не в PR. Нужен util-extension: боевой источник
      # зовёт WixQuietExec для enroll/uninstall.
      - name: wix build боевого MSI (то, что реально едет в поле)
        shell: pwsh
        run: |
          wix extension add -g WixToolset.Util.wixext/4.0.5
          wix build build/msi/mdm-agent.wxs -arch x64 -ext WixToolset.Util.wixext `
            -d Version=0.0.0 -d AgentExe=installer/windows/agent.exe -o prod-authoring.msi

      # UpgradeCode валидатора и боевого MSI обязаны РАЗЛИЧАТЬСЯ. Это не
      # придирка к стилю: совпади они — MSI, собранный в CI (другой профиль
      # установки, без SERVER_ADDR), стал бы для Windows апгрейдом боевой
      # установки и мог бы подменить рабочего агента на парке, случайно попав в
      # releases. Гейт держит расхождение намеренным, а не забытым.
      - name: гейт UpgradeCode (валидатор ≠ боевой)
        shell: pwsh
        run: |
          $rx = 'UpgradeCode="([0-9a-fA-F-]{36})"'
          $prod = (Select-String -Path build/msi/mdm-agent.wxs -Pattern $rx).Matches[0].Groups[1].Value
          $ci   = (Select-String -Path installer/windows/agent.wxs -Pattern $rx).Matches[0].Groups[1].Value
          Write-Host "боевой=$prod валидатор=$ci"
          if (-not $prod -or -not $ci) { Write-Error "UpgradeCode не найден в одном из .wxs"; exit 1 }
          if ($prod -eq $ci) {
            Write-Error "UpgradeCode совпали: MSI из CI стал бы апгрейдом боевой установки"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: agent-msi
          path: agent.msi

      # Реальная тихая установка MSI (без ENROLL_TOKEN → enroll-CA пропускается,
      # кладутся только файлы). Проверяем, что бинарь лёг в Program Files.
      - name: silent install MSI
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList '/i','agent.msi','/quiet','/l*v','install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { if (Test-Path install.log) { Get-Content install.log -Tail 50 }; throw "msiexec /i exit $($p.ExitCode)" }
          $exe = Join-Path $Env:ProgramFiles 'RoutineOps\RoutineOps-agent.exe'
          if (-not (Test-Path $exe)) { throw "agent.exe не установлен: $exe" }
          Write-Host "OK: установлен $exe"

      # Регистрация службы в SCM под LocalSystem — реальный путь install_windows.go
      # (CreateService + recovery actions). Сервер не нужен: проверяем сам факт
      # регистрации и снятия. Пути сертов фиктивные (читаются только при run).
      - name: smoke регистрации Windows-службы
        shell: pwsh
        run: |
          $exe = Join-Path $Env:ProgramFiles 'RoutineOps\RoutineOps-agent.exe'
          & $exe install -server localhost:50051 -server-name localhost -cert C:\mdm\agent.crt -key C:\mdm\agent.key -ca C:\mdm\ca.crt
          if ($LASTEXITCODE -ne 0) { throw "agent install exit $LASTEXITCODE" }
          sc.exe query RoutineOps-agent
          if ($LASTEXITCODE -ne 0) { throw "служба RoutineOps-agent не зарегистрирована" }
          & $exe uninstall
          if ($LASTEXITCODE -ne 0) { throw "agent uninstall exit $LASTEXITCODE" }
          Write-Host "OK: служба зарегистрирована и снята"

      # Тихое удаление MSI — должно убрать файлы (и службу через DoUninstall CA).
      - name: silent uninstall MSI
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList '/x','agent.msi','/quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exit $($p.ExitCode)" }
          $exe = Join-Path $Env:ProgramFiles 'RoutineOps\RoutineOps-agent.exe'
          if (Test-Path $exe) { throw "agent.exe остался после удаления: $exe" }
          Write-Host "OK: MSI удалён, файлы убраны"

  # 🔴 ОТДЕЛЬНАЯ джоба, а не флаг к предыдущей. Enterprise-код и его тесты живут под
  # `//go:build enterprise`, и обычный `go test`/`golangci-lint` их НЕ КОМПИЛИРУЕТ.
  # То есть весь платный набор — SAML, SCIM, SIEM, эскроу, лицензия, FileVault, CVE,
  # каналы обновлений — в CI не проверялся вообще ни разу: джоба выше была зелёной
  # ровно потому, что этих файлов для неё не существует. Ровно та же дыра нашлась и в
  # локальном pre-push (закрыта там же).
  enterprise:
    name: enterprise · test + lint (build tag)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdm_test
          POSTGRES_USER: mdm
          POSTGRES_PASSWORD: mdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdm -d mdm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # Публичный Free-репозиторий получает ЭТОТ ЖЕ файл (workflow'ы едут в срезе), но
      # БЕЗ enterprise-исходников — их вырезает export-free.sh. `go build -tags enterprise`
      # там падает по построению: «undefined: enterpriseSetup» и ещё десяток символов,
      # которых в открытой сборке нет и не должно быть. Проверено 03.08 на срезе 2.8.0 —
      # красный CI в публичном репозитории на совершенно здоровом коде.
      #
      # Поэтому джоба сначала спрашивает, есть ли что собирать под тегом, и в open-core
      # ЯВНО пропускает шаги с заметкой в логе, а не притворяется, что проверила. Условие
      # смотрит на composition-root enterprise: он есть только в приватном суперсете.
      - name: есть ли enterprise-исходники
        id: detect
        run: |
          if [ -f cmd/server/enterprise.go ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::enterprise-исходников нет (open-core срез) — сборка под тегом пропущена"
          fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: go.mod

      - name: build (enterprise)
        if: steps.detect.outputs.present == 'true'
        run: go build -tags enterprise ./...

      # -p 1: пакеты по одному. Параллельные пакеты дерутся за общую тестовую БД и
      # дают «connection refused» на ровном месте, а мигающий гейт хуже медленного.
      - name: test (enterprise)
        if: steps.detect.outputs.present == 'true'
        env:
          TEST_POSTGRES_DSN: postgres://mdm:mdm@localhost:5432/mdm_test?sslmode=disable
        run: go test -p 1 -tags enterprise ./internal/...

      - name: golangci-lint (enterprise)
        if: steps.detect.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags enterprise ./...

  # Сборка образа — БЕЗ публикации. Автодеплоя здесь нет и не должно быть: прод-запись
  # остаётся ручной. Смысл джобы в том, чтобы «собирается ли то, что мы выкатываем»
  # выяснялось на пуше, а не в момент, когда образ понадобился.
  image:
    name: docker · сборка образа (без публикации)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Обе редакции: open-core и enterprise собираются ОДНИМ Dockerfile через
        # build-arg, и ломается обычно ровно та, которую не собирают.
        edition: ["", "enterprise"]
    steps:
      - uses: actions/checkout@v4

      - name: docker build (${{ matrix.edition == '' && 'open-core' || matrix.edition }})
        run: |
          docker build \
            --build-arg BUILD_TAGS='${{ matrix.edition }}' \
            --build-arg VERSION="ci-${GITHUB_SHA::8}" \
            -t routineops-server:ci-${{ matrix.edition || 'free' }} .

  proto-breaking:
    name: proto · buf breaking
    # Валит сборку при ломающем изменении контракта (ADR-4: поля только
    # аддитивно, без удаления/смены номера/типа).
    #
    # Джоба была PR-only, и это делало её мёртвой: пушим мы ОБА прямо в main, а
    # на push baseline «ветка main» — это сам же push, сравнение вырождается и
    # всегда зелёное. Контракт вооружения (5e9d5ba) не проверил ни человек, ни
    # CI. Теперь baseline берётся по событию: на PR — main, на push — коммит ДО
    # пуша (github.event.before), то есть ровно то состояние контракта, которое
    # push и меняет.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # buf читает базовый контракт из локальной ветки main — подтягиваем её.
      # Только для PR: на push baseline адресуется по SHA, ветка не нужна.
      - name: fetch main
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: выбрать baseline
        id: baseline
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=branch=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Первый пуш в ветку или force-push с пересозданием истории: сравнивать
          # не с чем. Пропускаем ЯВНО, а не сравниваем с несуществующим коммитом —
          # иначе джоба падала бы на пустом месте и её отключили бы снова.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "baseline недоступен ($BEFORE) — сравнивать не с чем, пропуск"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=ref=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: buf breaking
        if: steps.baseline.outputs.skip != '1'
        # subdir=proto: читать baseline с корнем модуля = proto/, как в buf.yaml
        # текущей ветки. Иначе на бутстрап-PR (main ещё без buf.yaml) baseline
        # именует файл proto/agent.proto, а текущая ветка — agent.proto, и buf
        # ложно репортит «файл удалён».
        run: buf breaking --against ".git#${{ steps.baseline.outputs.ref }},subdir=proto"

  cross-build:
    name: cross-build агента
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Кросс-компиляция агента под все целевые ОС — ловит поломки в
      # платформенных файлах (priv_*/console_*/proc_*), невидимые при сборке на macOS.
      - name: build agent ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/agent
